<style>
/* Tek ekranlı mobil oyun: üstte portre + can/XP, ortada meşaleli taş labirent, altta joystick ve savaş düğmeleri. Bilinçli olarak tek (gece mavisi zindan) tema. */
:root {
  color-scheme: dark;
  --bg: #0a101d;
  --panel: #111a2c;
  --panel2: #0c1322;
  --line: #22314f;
  --line2: #3a5080;
  --fg: #e9eef8;
  --muted: #93a2c0;
  --gold: #f5c04a;
  --gold2: #a3741f;
  --hp: #e0413f;
  --xp: #3d8bff;
  --ok: #5fcf7a;
  --display: "Cinzel", "Times New Roman", serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #142039 0%, var(--bg) 60%) var(--bg);
  color: var(--fg); font-family: var(--body); font-weight: 700;
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
canvas.px { image-rendering: pixelated; }

/* Üst durum çubuğu */
.hud { display: flex; align-items: center; gap: 10px; }
.who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.portrait {
  width: 48px; height: 48px; border-radius: 50%; flex: none;

}
.portrait canvas { width: 100%; height: 100%; display: block; }
.bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hprow { display: flex; align-items: center; gap: 6px; }

.lvrow { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gold); font-weight: 900; min-width: 0; }

.namerow { display: flex; gap: 8px; }
.namerow input {

}
.namerow input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }

}
.score { font-size: 11px; background: #0c1322; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.iconbtn {

}

.shiftbar { width: 64px; height: 5px; border-radius: 3px; background: #142342; overflow: hidden; }
.shiftbar i { display: block; height: 100%; background: #4aa8ff; }
.warn { color: #6cb8ff; font-weight: 900; letter-spacing: .04em; }

/* Sahne */
#stage { flex: 1; min-height: 0; position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #070b14; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Kontroller */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 4px 2px; }
.joy {

}

.knob {

  box-shadow: 0 3px 8px rgba(0,0,0,.5); pointer-events: none;
}
.acts {
  display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 6px;
  grid-template-areas: "potion jump shield" "spin atk atk" ". atk atk";
}
.sk {
  --cd: 0;
  position: relative; border-radius: 50%; border: 2px solid var(--line2); touch-action: none; padding: 0;
  background: conic-gradient(rgba(5,8,16,.75) calc(var(--cd) * 1turn), transparent 0), radial-gradient(circle at 40% 35%, #26355a, #141e35 75%);
  display: grid; place-items: center;
}
.sk canvas { width: 30px; height: 30px; }
.sk small { position: absolute; bottom: -2px; right: -4px; min-width: 18px; padding: 0 4px; border-radius: 9px; background: var(--gold); color: #1a1206; font-size: 11px; font-weight: 900; line-height: 18px; }
.sk.locked { filter: grayscale(1) brightness(.6); }
.sk:not(.locked) small.lock { display: none; }
.sk.locked small { background: #3a4660; color: var(--fg); }
#bPotion { grid-area: potion; } #bJump { grid-area: jump; } #bShield { grid-area: shield; } #bSpin { grid-area: spin; }
#bAtk {
  grid-area: atk; border-radius: 50%; border: 3px solid #d8e2f5; touch-action: none; padding: 0;
  background: radial-gradient(circle at 40% 35%, #34446c, #182340 70%);
  box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 0 3px #22314f;
  display: grid; place-items: center;
}
#bAtk canvas { width: 58px; height: 58px; }
#bAtk:active, .sk:active { transform: scale(.95); }

/* Katmanlar */
#overlay {

  background: rgba(4, 7, 14, .84); backdrop-filter: blur(3px);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px));

}
.card {
  width: 100%; max-width: 440px; margin: auto;
  background: linear-gradient(#131d32, #0d1526); border: 1px solid var(--line2); border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  padding: 18px 16px; display: flex; flex-direction: column; gap: 12px;
}
.card h1, .card h2, .card h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.logo {
  font-size: 36px; line-height: 1.05; font-weight: 900; text-align: center;
  background: linear-gradient(#fff3c4, var(--gold) 45%, #c07f1a); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 #3a2508);
}
.tagline { text-align: center; color: var(--fg); font-size: 15px; }
.card h2 { font-size: 24px; color: var(--gold); }

.card p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 14px; font-weight: 600; }
.feats { display: grid; gap: 10px; }
.feat { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.feat canvas { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #8a6a24; background: #151d30; }

.feat span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.btn {
  border-radius: 10px; padding: 12px 16px; border: 1px solid #f5d27a;

}

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
.heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.hero { border: 1px solid var(--line2); border-radius: 10px; background: #0f1729; padding: 6px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.hero canvas { width: 56px; height: 56px; }

.hero[aria-checked="true"] { border-color: var(--gold); background: #2a2414; box-shadow: 0 0 0 1px var(--gold) inset; }
.hdetail { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; background: radial-gradient(circle at 20% 50%, #2f2716, transparent 60%); border-radius: 10px; }

.sbars { display: grid; gap: 6px; }
.sbars > div { display: grid; grid-template-columns: 64px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; }
.sbars b { text-align: right; font-variant-numeric: tabular-nums; }
.sbar { height: 8px; border-radius: 4px; background: #142342; overflow: hidden; }

.lineup { width: 100%; max-width: 336px; height: auto; align-self: center; margin-bottom: -6px; }
.vol { display: grid; grid-template-columns: 72px 1fr 44px; gap: 10px 10px; align-items: center; font-size: 14px; }
.vol input { width: 100%; accent-color: var(--gold); touch-action: none; height: 28px; }
.vol b { text-align: right; font-variant-numeric: tabular-nums; }
.rankmsg { color: var(--gold) !important; font-weight: 800 !important; text-align: center; }
.scores { display: grid; gap: 6px; }
.srow {
  display: grid; grid-template-columns: 30px 36px minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
  background: #0f1729; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 6px 8px;
}
.srow.me { border-color: var(--gold); background: #2a2414; }
.srank {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;

}
.srank.r1 { background: linear-gradient(#ffe28a, #c8901f); color: #2a1a04; }
.srank.r2 { background: linear-gradient(#eef2f8, #9aa4b4); color: #1a1f2a; }
.srank.r3 { background: linear-gradient(#f0b07a, #9a5a28); color: #2a1406; }
.srow canvas { width: 36px; height: 36px; border-radius: 8px; background: #16213a; }
.sname { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sname b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sname span { font-size: 11px; color: var(--muted); font-weight: 600; }
.sfloor { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sscore { font-size: 17px; font-weight: 900; color: var(--gold); text-align: right; min-width: 48px; font-variant-numeric: tabular-nums; }
.shead { display: grid; grid-template-columns: 30px 36px minmax(0, 1fr) auto auto; gap: 8px; padding: 0 10px 0 8px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.shead span:nth-child(4), .shead span:nth-child(5) { text-align: right; }
.shead span:nth-child(5) { min-width: 48px; }
.empty { text-align: center; padding: 18px 8px; border: 1px dashed var(--line2); border-radius: 10px; }
.btn.danger { background: #3a1418; border-color: #a83a3a; color: #ffb4b4; }
.slogan { text-align: center; font-family: var(--display); color: var(--gold); font-size: 14px; }

.charhead { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.charhead canvas { width: 96px; height: 96px; border-radius: 10px; border: 1px solid #6e5420; background: radial-gradient(circle at 50% 40%, #3a2d18, #151d30 75%); }
.charhead .xpbig { height: 14px; border-radius: 4px; background: #142342; border: 1px solid var(--line2); position: relative; overflow: hidden; margin-top: 6px; }
.charhead .xpbig i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffd77a, #c8901f); }
.charhead .xpbig em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 10px; text-shadow: 0 1px 0 #000; }
.stats { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stats div { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; font-size: 14px; }
.stats div + div { border-top: 1px solid var(--line); }
.stats canvas { width: 20px; height: 20px; }
.stats b { font-variant-numeric: tabular-nums; }
.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.skill { border: 1px solid var(--line2); border-radius: 10px; background: #0f1729; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 12px; }
.skill canvas { width: 40px; height: 40px; }
.skill span { color: var(--muted); font-size: 11px; font-weight: 600; }
.skill.locked canvas { filter: grayscale(1) brightness(.5); }

.shophead { display: flex; justify-content: space-between; align-items: center; background: #0c1322; border: 1px solid #5a4520; border-radius: 10px; padding: 8px 12px; }
.shophead h2 { font-size: 22px; }
.shophead .goldchip { font-size: 20px; color: var(--gold); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tab { border: 1px solid var(--line2); border-radius: 8px; background: #121b30; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tab canvas { width: 26px; height: 26px; }

.items { display: grid; gap: 8px; }

.item canvas { width: 50px; height: 50px; border-radius: 8px; border: 1px solid #6e5420; background: radial-gradient(circle at 50% 40%, #2f2716, #10182b 75%); }
.item .t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item .t b { font-size: 14px; }
.item .t span { font-size: 12px; color: var(--muted); font-weight: 600; }
.item .buycol { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.price { display: flex; align-items: center; gap: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
.price .coin { width: 14px; height: 14px; }
.buy { padding: 6px 10px; border-radius: 6px; border: 1px solid #f5d27a; background: linear-gradient(#f2c25a, #b8862a); color: #1a1206; font-weight: 900; font-size: 12px; white-space: nowrap; }

.kv div { background: #0c1322; border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: var(--muted); }

#toast {

  z-index: 15; pointer-events: none; font-family: var(--display); font-weight: 900; font-size: 18px; color: var(--gold); white-space: nowrap;

@media (prefers-reduced-motion: reduce) {
  .hpbar i, .xpbar i, #toast { transition: none; }
}
</style>

<div id="app">
  <header class="hud">
    <div class="who">
      <div class="portrait"><canvas id="portrait" class="px" width="48" height="48"></canvas></div>
      <div class="bars">
        <div class="hprow"><span>HP</span><div class="hpbar"><i id="hpFill"></i><em id="hpTxt">100/100</em></div></div>
        <div class="lvrow"><span id="lvTxt">Lv. 1</span><div class="xpbar"><i id="xpFill"></i></div></div>
      </div>
    </div>
    <div class="right">
      <div class="goldchip"><span class="coin"></span><b id="goldTxt">0</b></div>
      <div class="score">Puan: <b id="scoreTxt">0</b></div>
    </div>
    <button class="iconbtn" id="btnPause" aria-label="Karakter ve mola">II</button>
  </header>
  <div class="floorbar">
    <span><span class="theme" id="floorTxt">Kat 1</span> · <span id="monTxt">Canavar 0</span></span>
    <span class="shiftbox"><span id="shiftTxt">Kayma 0.0 sn</span><span class="shiftbar"><i id="shiftFill"></i></span></span>
  </div>
  <main id="stage"><canvas id="cv"></canvas></main>
  <footer class="controls">
    <div class="joy" id="joy" aria-label="Hareket joystick'i"><div class="knob" id="knob"></div></div>
    <div class="acts">
      <button class="sk" id="bPotion" aria-label="Can iksiri iç"><canvas data-ico="potion" width="30" height="30"></canvas><small id="potCnt">0</small></button>
      <button class="sk" id="bJump" aria-label="Zıplama"><canvas data-ico="jump" width="30" height="30"></canvas><small class="lock">Lv5</small></button>
      <button class="sk" id="bShield" aria-label="Kalkan"><canvas data-ico="shield" width="30" height="30"></canvas><small class="lock">Lv10</small></button>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const lightCv = document.createElement('canvas'), lk = lightCv.getContext('2d');
const cacheCv = document.createElement('canvas'), ck = cacheCv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Yön bit maskesi: her karo hangi kenarlarının açık olduğunu tutar
const N = 1, E = 2, S = 4, W = 8, ALL = [N, E, S, W];
const DIRS = { 1: [0, -1], 2: [1, 0], 4: [0, 1], 8: [-1, 0] };
const OPP = { 1: 4, 2: 8, 4: 1, 8: 2 };
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const dirOf = (dx, dy) => dy < 0 ? N : dx > 0 ? E : dy > 0 ? S : W;

/* ---------- Piksel sanat ---------- */
// Spritelar 24x24. Simetrik olanlar sol yarı (12 sütun) olarak yazılır ve aynalanır.
const SZ = 24, HALF = 12;
const mirror = rows => rows.map(r => {
  if (r.length !== HALF) console.warn('sprite yarısı 12 değil:', r);
  r = r.padEnd(HALF, '.').slice(0, HALF);
  return r + [...r].reverse().join('');
});
function bake(rows, pal) {
  rows = rows.slice();
  while (rows.length < SZ) rows.unshift('');
  const c = document.createElement('canvas'); c.width = c.height = SZ;
  const k = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < SZ; x++) if (pal[r[x]]) { k.fillStyle = pal[r[x]]; k.fillRect(x, y, 1, 1); }
  });
  return c;
}
function sprite(rows, pal) {
  const c = bake(rows, pal);
  const flip = document.createElement('canvas'); flip.width = flip.height = SZ;
  const fk = flip.getContext('2d'); fk.translate(SZ, 0); fk.scale(-1, 1); fk.drawImage(c, 0, 0);
  const white = src => {
    const o = document.createElement('canvas'); o.width = o.height = SZ;
    const ok = o.getContext('2d'); ok.drawImage(src, 0, 0);
    ok.globalCompositeOperation = 'source-atop'; ok.fillStyle = '#ffffff'; ok.fillRect(0, 0, SZ, SZ);
    return o;
  };
  return { r: c, l: flip, wr: white(c), wl: white(flip) };
}

function genMaze(w, h) {
  const t = [...Array(h)].map(() => Array(w).fill(0));
  const seen = [...Array(h)].map(() => Array(w).fill(false));
  const st = [[ri(0, w - 1), ri(0, h - 1)]];
  seen[st[0][1]][st[0][0]] = true;
  while (st.length) {
    const [x, y] = st[st.length - 1];
    const opts = ALL.filter(d => {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      return nx >= 0 && ny >= 0 && nx < w && ny < h && !seen[ny][nx];
    });
    if (!opts.length) { st.pop(); continue; }
    const d = pick(opts), nx = x + DIRS[d][0], ny = y + DIRS[d][1];
    t[y][x] |= d; t[ny][nx] |= OPP[d]; seen[ny][nx] = true; st.push([nx, ny]);
  }
  // Döngüler ekle: kayma sonrası çıkmazlar daha az olsun

function paintLineup(cnv) {
  if (!cnv) return;
  const W = 336, Hh = 96, k = cnv.getContext('2d');
  cnv.width = W * DPR; cnv.height = Hh * DPR;
  k.setTransform(DPR, 0, 0, DPR, 0, 0); k.imageSmoothingEnabled = false;
  const g = k.createRadialGradient(W / 2, Hh - 8, 10, W / 2, Hh - 8, W / 2);
  g.addColorStop(0, 'rgba(245,192,74,.35)'); g.addColorStop(1, 'rgba(245,192,74,0)');
  k.fillStyle = g; k.fillRect(0, 0, W, Hh);
  const cast = [[SPR.bat.r, 4, 56, -34], [HEROES.barbarian.front[0].r, 20, 84], [HEROES.thief.front[0].r, 168, 84], [HEROES.mage.front[0].r, 232, 84], [HEROES.knight.front[0].r, 92, 92], [SPR.goblin.l, 284, 56]];
  for (const [img, x, s, dy = 0] of cast) {
    k.fillStyle = 'rgba(0,0,0,.4)';
    k.beginPath(); k.ellipse(x + s / 2, Hh - 4, s * .32, 4, 0, 0, Math.PI * 2); k.fill();

  }
}

const joy = $('joy'), knob = $('knob');
let joyId = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = r.width * .3;
  if (len > max) { dx *= max / len; dy *= max / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  if (len < 12) { input.held = 0; return; }
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? E : W) : (dy > 0 ? S : N);
  if (d !== input.held) { input.held = d; input.queued = d; }
}
joy.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  joyId = e.pointerId; joy.setPointerCapture?.(e.pointerId); joyMove(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; input.held = 0; knob.style.transform = ''; };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => joy.addEventListener(t, joyEnd));

const press = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); fn(); });

let sw = null;

cv.addEventListener('pointerup', e => {
  if (!sw || !G || G.state !== 'play') { sw = null; return; }
  let dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) < 18) {
    // Dokunma: oyuncuya göre dokunulan yöne bir adım
    const r = cv.getBoundingClientRect(), { c, ox, oy } = layout();
    dx = e.clientX - r.left - (ox + (G.p.x + .5) * c);
    dy = e.clientY - r.top - (oy + (G.p.y + .5) * c);
    if (Math.hypot(dx, dy) < c * .4) { sw = null; attack(); return; }
  }
  input.queued = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? E : W) : (dy > 0 ? S : N);

const KEYS = { ArrowUp: N, KeyW: N, ArrowRight: E, KeyD: E, ArrowDown: S, KeyS: S, ArrowLeft: W, KeyA: W };
const typing = e => e.target && e.target.tagName === 'INPUT';
addEventListener('keydown', e => {
  if (typing(e)) return;
  initAudio();
  if (KEYS[e.code]) {
    e.preventDefault();
    if (!e.repeat) { input.keys = input.keys.filter(k => k !== KEYS[e.code]); input.keys.push(KEYS[e.code]); input.queued = KEYS[e.code]; }
    input.held = input.keys[input.keys.length - 1];
  } else if (e.code === 'Space' || e.code === 'KeyJ') { e.preventDefault(); attack(); }
  else if (e.code === 'KeyQ') useSkill('spin');
  else if (e.code === 'KeyE') useSkill('jump');
  else if (e.code === 'KeyR') useSkill('shield');
  else if (e.code === 'KeyF') drinkPotion();
  else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (G && G.state === 'pause') { G.state = 'play'; duck(false); hideOverlay(); } else showPause();
  }
});
addEventListener('keyup', e => {
  if (typing(e)) return;

/* ---------- Ses ---------- */
// Tüm müzik ve efektler WebAudio ile anında üretilir; ses dosyası yoktur.
let AC = null, master, musicBus, sfxBus, revSend, noiseBuf, ducked = false;

function applyVolumes() {
  if (!AC) return;
  musicBus.gain.setTargetAtTime(AUDIO.music * .34 * (ducked ? .4 : 1), AC.currentTime, .15);
  sfxBus.gain.setTargetAtTime(AUDIO.sfx * .9, AC.currentTime, .05);

function suspendAudio() { if (AC && AC.state === 'running') AC.suspend(); }

// Tek nota: osilatör + zarf; isteğe bağlı filtre, perde kayması ve yankı
function tone(o) {

// Filtrelenmiş gürültü: savurma, darbe, gümbürtü, zil

const semi = (f, s) => f * Math.pow(2, s / 12);
const SFX = {
  swing: () => noise({ d: .15, v: .22, filter: ['bandpass', 800, 1.4], f2: 3600, a: .03 }),
  spin: () => { noise({ d: .34, v: .28, filter: ['bandpass', 500, 1.6], f2: 4200, a: .06 }); noise({ t: .12, d: .25, v: .16, filter: ['bandpass', 900, 1.6], f2: 3000, a: .04 }); },
  hit: () => { tone({ f: 190, f2: 55, d: .15, v: .5 }); noise({ d: .05, v: .28, filter: ['highpass', 1800] }); },
  crit: () => { tone({ f: 1318, type: 'triangle', d: .4, v: .16, rev: .6 }); tone({ f: 1975, d: .32, v: .09, t: .03, rev: .6 }); },
  kill: () => {
    tone({ f: 520, f2: 130, type: 'square', d: .2, v: .1, filter: ['lowpass', 1800] });
    noise({ t: .03, d: .32, v: .24, filter: ['lowpass', 1400], f2: 180, rev: .35 });
  },
  coin: () => { tone({ f: 988, type: 'square', d: .07, v: .07, filter: ['lowpass', 4500] }); tone({ f: 1319, type: 'square', d: .2, v: .07, t: .06, filter: ['lowpass', 4500], rev: .3 }); },
  chest: () => [0, 4, 7, 12, 16, 19].forEach((s, i) => tone({ f: semi(523, s), type: 'triangle', d: .4, v: .11, t: i * .055, rev: .6 })),
  hurt: () => { tone({ f: 150, f2: 65, type: 'sawtooth', d: .22, v: .18, filter: ['lowpass', 900] }); noise({ d: .12, v: .24, filter: ['bandpass', 600, .8] }); },
  block: () => { tone({ f: 1760, type: 'triangle', d: .3, v: .11, rev: .6 }); tone({ f: 2349, d: .22, v: .07, rev: .6 }); },
  step: () => noise({ d: .045, v: .05, filter: ['lowpass', 450 + Math.random() * 350] }),
  rumble: () => { noise({ d: 1.7, v: .2, filter: ['lowpass', 170], a: .6 }); tone({ f: 49, d: 1.7, v: .16, a: .6 }); },
  shift: () => { noise({ d: .7, v: .34, filter: ['lowpass', 420], f2: 110, rev: .45 }); tone({ f: 72, f2: 38, type: 'triangle', d: .55, v: .32 }); },
  portal: () => [0, 7, 12, 19, 24].forEach((s, i) => tone({ f: semi(392, s), d: .7, v: .09, t: i * .08, rev: .9 })),
  level: () => {
    [0, 4, 7, 12].forEach((s, i) => tone({ f: semi(523, s), type: 'square', d: .22, v: .07, t: i * .1, filter: ['lowpass', 3200], rev: .4 }));
    tone({ f: 1047, type: 'triangle', d: .8, v: .12, t: .4, rev: .7 });
    tone({ f: 1319, type: 'triangle', d: .8, v: .08, t: .4, rev: .7 });
  },
  buy: () => { tone({ f: 1568, type: 'square', d: .08, v: .06, filter: ['lowpass', 5000] }); tone({ f: 2093, type: 'square', d: .22, v: .06, t: .07, filter: ['lowpass', 5000], rev: .35 }); },
  potion: () => { for (let i = 0; i < 6; i++) tone({ f: 380 + i * 110 + Math.random() * 60, f2: 650 + i * 140, d: .08, v: .09, t: i * .05 }); },
  shield: () => [0, 4, 7, 12].forEach(s => tone({ f: semi(659, s), type: 'triangle', d: 1.1, v: .06, a: .06, rev: .9 })),
  jump: () => tone({ f: 250, f2: 760, type: 'square', d: .22, v: .07, filter: ['lowpass', 2200] }),
  bolt: () => { tone({ f: 1500, f2: 280, type: 'sawtooth', d: .24, v: .07, filter: ['lowpass', 3200], rev: .55 }); noise({ d: .16, v: .1, filter: ['highpass', 3200] }); },
  gameover: () => [12, 7, 3, 0, -5].forEach((s, i) => tone({ f: semi(220, s), type: 'triangle', d: .7, v: .13, t: i * .24, rev: .8 })),
  tap: () => tone({ f: 880, type: 'square', d: .035, v: .035, filter: ['lowpass', 3000] }),

function sfx(k) {
  if (!AC || AUDIO.sfx <= 0 || !SFX[k] || AC.state !== 'running') return;
  try { SFX[k](); } catch (e) {}
}

/* ---------- Müzik ---------- */
// Her parça: tempo, kök nota (MIDI), dizi, akor yürüyüşü ve davul yoğunluğu.
const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10],
  harmonic: [0, 2, 3, 5, 7, 8, 11], major: [0, 2, 4, 5, 7, 9, 11],
};
const SONGS = {
  title:  { bpm: 74,  root: 57, scale: 'minor',    prog: [0, 5, 3, 6], drums: 0, lead: 'triangle', arp: 'sine',     bright: 1100, seed: 11 },
  kolay:  { bpm: 96,  root: 57, scale: 'dorian',   prog: [0, 3, 6, 4], drums: 1, lead: 'square',   arp: 'triangle', bright: 1600, seed: 21 },
  orta:   { bpm: 104, root: 50, scale: 'minor',    prog: [0, 5, 6, 4], drums: 1, lead: 'triangle', arp: 'square',   bright: 1400, seed: 33 },
  zor:    { bpm: 116, root: 52, scale: 'phrygian', prog: [0, 1, 0, 6], drums: 2, lead: 'sawtooth', arp: 'square',   bright: 1200, seed: 45 },
  efsane: { bpm: 108, root: 49, scale: 'harmonic', prog: [0, 5, 3, 4], drums: 2, lead: 'triangle', arp: 'sawtooth', bright: 1300, seed: 57 },
  boss:   { bpm: 134, root: 45, scale: 'harmonic', prog: [0, 0, 5, 4], drums: 3, lead: 'sawtooth', arp: 'square',   bright: 1700, seed: 69 },
  shop:   { bpm: 84,  root: 60, scale: 'major',    prog: [0, 5, 3, 4], drums: 0, lead: 'triangle', arp: 'sine',     bright: 2000, seed: 81 },
};
const midiF = n => 440 * Math.pow(2, (n - 69) / 12);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Ezgi tohuma göre bir kez üretilir; 3. ölçü 1. ölçünün motifini yeni akora taşır
function buildSong(cfg) {
  const S = Object.assign({}, cfg), r = rng(cfg.seed), sc = SCALES[cfg.scale];
  const rp = arr => arr[Math.floor(r() * arr.length)];
  S.note = deg => S.root + sc[((deg % 7) + 7) % 7] + 12 * Math.floor(deg / 7);
  const bars = cfg.prog.length, mel = Array(bars * 16).fill(null);
  const rhythm = [0, 3, 6, 8, 10, 12, 14];
  const motif = [];
  for (let b = 0; b < bars; b++) {
    const ch = cfg.prog[b];
    let cur = ch + rp([0, 2, 4]);
    for (const st of rhythm) {
      if (b === 2 && motif.length) { const m = motif.find(x => x.st === st); if (m) mel[b * 16 + st] = m.rel + ch; continue; }
      if (r() < (st === 0 ? .95 : .55)) {
        cur += r() < .6 ? rp([-1, 1]) : rp([-2, 2, 0]);
        if (st % 8 === 0) cur = ch + rp([0, 2, 4]);
        cur = Math.max(ch - 3, Math.min(ch + 7, cur));
        mel[b * 16 + st] = cur;
        if (b === 0) motif.push({ st, rel: cur - ch });
      }
    }

  S.mel = mel;
  return S;
}
let song = null, songName = '', step = 0, nextT = 0, schedTimer = null;
function setMusic(name) {
  if (name === songName) return;
  songName = name;
  song = name ? buildSong(SONGS[name]) : null;
  step = 0;
  if (AC) nextT = AC.currentTime + .12;
}
function startScheduler() {
  if (schedTimer) return;
  nextT = AC.currentTime + .12;
  schedTimer = setInterval(() => {
    if (!AC || !song || AC.state !== 'running' || AUDIO.music <= 0) return;
    if (nextT < AC.currentTime - .25) nextT = AC.currentTime + .05;
    while (nextT < AC.currentTime + .16) {
      playStep(step, nextT);
      nextT += 60 / song.bpm / 4;
      step = (step + 1) % (16 * song.prog.length);
    }
  }, 25);
}
function playStep(s, t) {
  const S = song, bar = Math.floor(s / 16), st = s % 16, ch = S.prog[bar], six = 60 / S.bpm / 4, bus = musicBus;
  if (st === 0) {
    // Yumuşak akor dolgusu
    for (const [i, dt] of [[0, -7], [2, 5], [4, -3]]) tone({ at: t, f: midiF(S.note(ch + i) + 12), type: 'sawtooth', d: six * 16, a: six * 4, v: .028, detune: dt, filter: ['lowpass', S.bright * .6], bus, rev: .5 });
  }
  if (st === 0 || st === 8 || (S.drums >= 2 && (st === 6 || st === 14)))
    tone({ at: t, f: midiF(S.note(ch) - 12), type: 'triangle', d: six * (st % 8 ? 2 : 6), v: .24, bus });
  const arpEvery = S.drums >= 2 ? 1 : 2;
  if (st % arpEvery === 0) {
    const pat = [0, 2, 4, 7, 4, 2, 0, 4][(st / arpEvery) % 8];
    tone({ at: t, f: midiF(S.note(ch + pat) + 12), type: S.arp, d: six * 1.6, v: .035, filter: ['lowpass', S.bright], bus, rev: .3 });
  }

  if (m != null) tone({ at: t, f: midiF(S.note(m) + 24), type: S.lead, d: six * 2.8, a: .01, v: S.lead === 'sawtooth' || S.lead === 'square' ? .04 : .07, filter: ['lowpass', S.bright * 1.6], bus, rev: .45 });

      tone({ at: t, f: 125, f2: 42, d: .2, v: .34, bus });
    if (st % 4 === 2 || (S.drums >= 3 && st % 2 === 1)) noise({ at: t, d: .04, v: .045, filter: ['highpass', 7000], bus });

  }
}
const musicFor = F => F % 5 === 0 ? 'boss' : ['kolay', 'orta', 'zor', 'efsane'][THEMES.indexOf(themeFor(F))];
function audioHtml() {
  const row = (id, label, v) => `<label for="${id}">${label}</label><input id="${id}" type="range" min="0" max="100" step="5" value="${Math.round(v * 100)}"><b id="${id}Txt">%${Math.round(v * 100)}</b>`;
  return `<div class="vol">${row('volMusic', 'Müzik', AUDIO.music)}${row('volSfx', 'Efektler', AUDIO.sfx)}</div>`;

/* ---------- Döngü ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  if (G) update(dt);
  render(now);
  updateHud();
  animatePreview(now);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
new ResizeObserver(resize).observe($('stage'));

function start(data) {
  resize();
  paintAll(document);
  paintIcon($('portrait'), 'face');
  if (data && data.floor && data.acc) newRun(data);
  else {
    // Başlık ekranının arkasında örnek bir kat görünsün
    G = freshRun();
    startLevel(true);
    G.state = 'title';
    showTitle();
  }
  requestAnimationFrame(frame);
}
// Android uygulaması geri tuşu ve arka plana geçişte bunları çağırır
window.kayanPause = () => { showPause(); suspendAudio(); };
window.kayanResume = resumeAudio;
window.kayanBack = () => {
  if (!G) return false;
  if (G.state === 'play') { showPause(); return true; }
  if (G.state === 'pause') { G.state = 'play'; duck(false); hideOverlay(); return true; }
  return G.state === 'shop';
};
window.claude?.hot?.snapshot?.(() => G && (G.state === 'play' || G.state === 'pause' || G.state === 'shop') ? runData() : {});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
